apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ci-api
  namespace: devops-app
  labels:
    app: devops-ci-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ci-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-ci-api
        version: v1
    spec:
      # Security: Run as non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: api
        image: IMAGE_NAME:latest  # Will be replaced by deployment script
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Security: Drop all capabilities and add only what's needed
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        
        # Resource limits for stability
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /users
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /users
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Environment variables (can be extended)
        env:
        - name: JAVA_OPTS
          value: "-Xmx256m -Xms128m"
        - name: SERVER_PORT
          value: "8080"
      
      # Restart policy
      restartPolicy: Always
