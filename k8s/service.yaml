apiVersion: v1
kind: Service
metadata:
  name: devops-ci-api-service
  namespace: devops-app
  labels:
    app: devops-ci-api
spec:
  type: NodePort
  selector:
    app: devops-ci-api
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080  # Accessible on localhost:30080 in local K8s
  sessionAffinity: None
