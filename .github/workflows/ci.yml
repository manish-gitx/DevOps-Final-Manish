name: CI - Build, Test & Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-ci-api
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Stage 1: Setup & Initialize
  # ============================================
  setup:
    name: Setup & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run Checkstyle
      run: mvn checkstyle:check
    
    - name: Run Unit Tests
      run: mvn test
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
  
  # ============================================
  # Stage 2: Security Scanning - SCA
  # ============================================
  security-sca:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner (SCA)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-sca-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
    
    - name: Upload Trivy SCA results to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-sca-results.sarif'
        category: 'trivy-sca'
  
  # ============================================
  # Stage 3: SAST - Static Application Security Testing
  # ============================================
  security-sast:
    name: CodeQL Analysis (SAST)
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
  
  # ============================================
  # Stage 4: Build & Package
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [setup, security-sca]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build JAR
      run: mvn clean package -DskipTests
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar
        retention-days: 30
  
  # ============================================
  # Stage 5: Container Build & Security Scan
  # ============================================
  docker-build-scan:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [build, security-sast]
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          ${{ env.DOCKER_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Trivy vulnerability scanner (Image)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
    
    - name: Upload Trivy Image results to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-image-results.sarif'
        category: 'trivy-image'
    
    - name: Save Docker image
      run: |
        docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} | gzip > docker-image.tar.gz
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: docker-image.tar.gz
        retention-days: 7
  
  # ============================================
  # Stage 6: Runtime Validation
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build-scan
    
    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: |
        docker load < docker-image.tar.gz
        docker images
    
    - name: Run container
      run: |
        docker run -d -p 8080:8080 --name test-api ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        
    - name: Wait for application to start
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/users; do sleep 2; done'
    
    - name: Test /users endpoint
      run: |
        response=$(curl -s http://localhost:8080/users)
        echo "Response: $response"
        if [[ "$response" == *"Alice"* ]]; then
          echo "✅ Smoke test passed!"
        else
          echo "❌ Smoke test failed!"
          exit 1
        fi
    
    - name: Check container logs
      if: always()
      run: docker logs test-api
    
    - name: Stop container
      if: always()
      run: docker stop test-api
  
  # ============================================
  # Stage 7: Publish to Registry
  # ============================================
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: docker load < docker-image.tar.gz
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        docker push ${{ env.DOCKER_IMAGE }}:latest
        echo "✅ Image pushed: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
        echo "✅ Image pushed: ${{ env.DOCKER_IMAGE }}:latest"
    
    - name: Generate image metadata
      id: meta
      run: |
        echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "IMAGE_URL=${{ env.DOCKER_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
    
    - name: Create deployment artifact
      run: |
        echo "${{ steps.meta.outputs.IMAGE_TAG }}" > image-tag.txt
        echo "${{ steps.meta.outputs.IMAGE_URL }}" > image-url.txt
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-info
        path: |
          image-tag.txt
          image-url.txt
        retention-days: 90
  
  # ============================================
  # Stage 8: Pipeline Summary
  # ============================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()
    
    steps:
    - name: Pipeline Summary
      run: |
        echo "## 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
        echo "- Commit SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Image:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.DOCKER_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
        echo "- Image is ready for deployment to Kubernetes" >> $GITHUB_STEP_SUMMARY
        echo "- Use CD pipeline to deploy to environments" >> $GITHUB_STEP_SUMMARY
