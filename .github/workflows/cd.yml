name: CD - Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  
  # Automatically trigger after successful CI on main branch
  workflow_run:
    workflows: ["CI - Build, Test & Security Scan"]
    types:
      - completed
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-ci-api
  KUBECTL_VERSION: 'v1.28.0'

jobs:
  # ============================================
  # Determine Deployment Environment
  # ============================================
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      namespace: ${{ steps.set-env.outputs.namespace }}
    
    steps:
    - name: Set deployment parameters
      id: set-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ github.event.inputs.environment }}"
          TAG="${{ github.event.inputs.image_tag }}"
        else
          # Auto-deploy to development on main branch push
          ENV="development"
          TAG="latest"
        fi
        
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "image_tag=$TAG" >> $GITHUB_OUTPUT
        
        # Set namespace based on environment
        case $ENV in
          development)
            echo "namespace=devops-app-dev" >> $GITHUB_OUTPUT
            ;;
          staging)
            echo "namespace=devops-app-staging" >> $GITHUB_OUTPUT
            ;;
          production)
            echo "namespace=devops-app-prod" >> $GITHUB_OUTPUT
            ;;
        esac
        
        echo "🎯 Deploying to: $ENV"
        echo "🏷️ Image tag: $TAG"
  
  # ============================================
  # Deploy to Development
  # ============================================
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.environment == 'development'
    environment:
      name: development
      url: ${{ steps.get-url.outputs.url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: ${{ env.KUBECTL_VERSION }}
    
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: 'latest'
    
    - name: Install GKE Auth Plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin --quiet
        echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Configure Kubernetes context
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
        # Fix gke-gcloud-auth-plugin path for cross-platform compatibility
        sed -i 's|/opt/homebrew/share/google-cloud-sdk/bin/gke-gcloud-auth-plugin|gke-gcloud-auth-plugin|g' $HOME/.kube/config
    
    - name: Verify cluster connection
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ needs.prepare.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to Kubernetes
      run: |
        # Apply ConfigMap
        kubectl apply -f k8s/configmap.yaml -n ${{ needs.prepare.outputs.namespace }}
        
        # Update deployment with correct image
        sed "s|IMAGE_NAME:latest|${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}|g" k8s/deployment.yaml | \
          sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" | \
          kubectl apply -f -
        
        # Apply service
        sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" k8s/service.yaml | \
          kubectl apply -f -
        
        # Apply network policy if exists
        if [ -f k8s/networkpolicy.yaml ]; then
          sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" k8s/networkpolicy.yaml | \
            kubectl apply -f -
        fi
    
    - name: Wait for deployment to be ready
      run: |
        kubectl rollout status deployment/devops-ci-api -n ${{ needs.prepare.outputs.namespace }} --timeout=5m
    
    - name: Verify deployment
      run: |
        echo "📊 Deployment Status:"
        kubectl get all -n ${{ needs.prepare.outputs.namespace }}
        
        echo ""
        echo "🔍 Pod Details:"
        kubectl describe pods -l app=devops-ci-api -n ${{ needs.prepare.outputs.namespace }}
    
    - name: Get service URL
      id: get-url
      run: |
        SERVICE_URL=$(kubectl get svc devops-ci-api-service -n ${{ needs.prepare.outputs.namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        if [ -z "$SERVICE_URL" ]; then
          SERVICE_URL="http://localhost:8080"
        fi
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
        echo "🌐 Service URL: $SERVICE_URL"
    
    - name: Run health check
      run: |
        echo "🏥 Running health check..."
        POD_NAME=$(kubectl get pod -l app=devops-ci-api -n ${{ needs.prepare.outputs.namespace }} -o jsonpath="{.items[0].metadata.name}")
        kubectl exec -n ${{ needs.prepare.outputs.namespace }} $POD_NAME -- wget -qO- http://localhost:8080/users
        echo "✅ Health check passed!"
  
  # ============================================
  # Deploy to Staging (requires approval)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.get-url.outputs.url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: ${{ env.KUBECTL_VERSION }}
    
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: 'latest'
    
    - name: Install GKE Auth Plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin --quiet
        echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Configure Kubernetes context
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
        # Fix gke-gcloud-auth-plugin path for cross-platform compatibility
        sed -i 's|/opt/homebrew/share/google-cloud-sdk/bin/gke-gcloud-auth-plugin|gke-gcloud-auth-plugin|g' $HOME/.kube/config
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ needs.prepare.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/configmap.yaml -n ${{ needs.prepare.outputs.namespace }}
        
        sed "s|IMAGE_NAME:latest|${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}|g" k8s/deployment.yaml | \
          sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" | \
          kubectl apply -f -
        
        sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" k8s/service.yaml | \
          kubectl apply -f -
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/devops-ci-api -n ${{ needs.prepare.outputs.namespace }} --timeout=5m
    
    - name: Verify deployment
      run: |
        kubectl get all -n ${{ needs.prepare.outputs.namespace }}
    
    - name: Get service URL
      id: get-url
      run: |
        SERVICE_URL=$(kubectl get svc devops-ci-api-service -n ${{ needs.prepare.outputs.namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
  
  # ============================================
  # Deploy to Production (requires approval)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.get-url.outputs.url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: ${{ env.KUBECTL_VERSION }}
    
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: 'latest'
    
    - name: Install GKE Auth Plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin --quiet
        echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Configure Kubernetes context
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
        # Fix gke-gcloud-auth-plugin path for cross-platform compatibility
        sed -i 's|/opt/homebrew/share/google-cloud-sdk/bin/gke-gcloud-auth-plugin|gke-gcloud-auth-plugin|g' $HOME/.kube/config
    
    - name: Pre-deployment verification
      run: |
        echo "🔍 Verifying image exists in registry..."
        docker pull ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
        
        echo "🔍 Running final security scan..."
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --severity HIGH,CRITICAL \
          ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ needs.prepare.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Backup current deployment
      run: |
        kubectl get deployment devops-ci-api -n ${{ needs.prepare.outputs.namespace }} -o yaml > backup-deployment.yaml || true
    
    - name: Deploy to Production
      run: |
        kubectl apply -f k8s/configmap.yaml -n ${{ needs.prepare.outputs.namespace }}
        
        sed "s|IMAGE_NAME:latest|${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}|g" k8s/deployment.yaml | \
          sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" | \
          sed "s|replicas: 2|replicas: 3|g" | \
          kubectl apply -f -
        
        sed "s|namespace: devops-app|namespace: ${{ needs.prepare.outputs.namespace }}|g" k8s/service.yaml | \
          kubectl apply -f -
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/devops-ci-api -n ${{ needs.prepare.outputs.namespace }} --timeout=10m
    
    - name: Run production health checks
      run: |
        echo "🏥 Running comprehensive health checks..."
        kubectl get all -n ${{ needs.prepare.outputs.namespace }}
        
        POD_NAME=$(kubectl get pod -l app=devops-ci-api -n ${{ needs.prepare.outputs.namespace }} -o jsonpath="{.items[0].metadata.name}")
        
        for i in {1..5}; do
          echo "Health check attempt $i/5..."
          kubectl exec -n ${{ needs.prepare.outputs.namespace }} $POD_NAME -- wget -qO- http://localhost:8080/users
          sleep 2
        done
        
        echo "✅ All health checks passed!"
    
    - name: Get service URL
      id: get-url
      run: |
        SERVICE_URL=$(kubectl get svc devops-ci-api-service -n ${{ needs.prepare.outputs.namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
    
    - name: Upload backup
      uses: actions/upload-artifact@v4
      with:
        name: production-backup
        path: backup-deployment.yaml
        retention-days: 30
  
  # ============================================
  # Deployment Summary
  # ============================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, deploy-development, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ needs.prepare.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Namespace:** ${{ needs.prepare.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.deploy-development.result }}" == "success" ]] || \
           [[ "${{ needs.deploy-staging.result }}" == "success" ]] || \
           [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
        fi
